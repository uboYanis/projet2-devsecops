title = "Gitleaks config - projet2-devsecops"

[extend]
useDefault = true

[[rules]]
id = "generic-password-assignment"
description = "Mot de passe en clair dans le code"
regex = '''(?i)(password|passwd|pwd|secret|token)\s*=\s*["'][^"']{6,}["']'''
entropy = 0
keywords = ["password", "passwd", "pwd", "secret", "token"]
