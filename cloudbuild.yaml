steps:
  # Étape 1 : Tests unitaires API
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd services/api
        pip install -r requirements.txt
        python -m pytest tests/ -v

  # Étape 2 : Scan secrets avec Gitleaks (bloquant)
  - name: 'zricethezav/gitleaks'
    entrypoint: 'gitleaks'
    args: ['detect', '--source', '.', '--config', '.gitleaks.toml', '--exit-code', '1', '-v']

  # Étape 3 : SAST avec Semgrep
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install semgrep
        semgrep --config=auto services/ --error

  # Étape 4 : Scan IaC avec Checkov
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install checkov
        checkov -d terraform/ --compact --soft-fail

  # Étape 5 : Build du frontend React
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd services/front
        npm ci
        npm run build

  # Étape 6 : Build image API (contexte racine pour inclure le frontend buildé)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/notes-repo/api:$COMMIT_SHA'
      - '-f'
      - 'services/api/Dockerfile'
      - '.'

  # Étape 7 : Scan image avec Trivy (fail sur CVE critique)
  - name: 'aquasec/trivy'
    args:
      - 'image'
      - '--exit-code'
      - '1'
      - '--severity'
      - 'CRITICAL'
      - '--ignore-unfixed'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/notes-repo/api:$COMMIT_SHA'

  # Étape 8 : Push image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/notes-repo/api:$COMMIT_SHA']

  # Étape 9 : Récupérer l'IP privée de Cloud SQL via Terraform output
  - name: 'hashicorp/terraform:1.5'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd terraform/staging
        terraform init -reconfigure
        terraform output -raw db_host > /workspace/db_host.txt

  # Étape 10 : Déploiement sur Cloud Run staging (IAP activé)
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        DB_HOST=$$(cat /workspace/db_host.txt)
        gcloud run deploy notes-api-staging \
          --image=europe-west1-docker.pkg.dev/$PROJECT_ID/notes-repo/api:$COMMIT_SHA \
          --region=europe-west1 \
          --platform=managed \
          --no-allow-unauthenticated \
          --iap \
          --service-account=notes-api-sa@$PROJECT_ID.iam.gserviceaccount.com \
          --set-secrets=DB_PASSWORD=staging-db-password:latest \
          --set-env-vars=DB_HOST=$$DB_HOST,DB_NAME=notes,DB_USER=notes-app \
          --vpc-connector=staging-vpc-connector \
          --vpc-egress=private-ranges-only

options:
  logging: CLOUD_LOGGING_ONLY
